name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @india-trikotaj/shared
        run: pnpm --filter @india-trikotaj/shared build

      - name: Export Hermes production bundle
        run: pnpm --dir apps/mobile exec expo export -p android --output-dir dist/android

      - name: Expo Prebuild Android
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --no-install

      - name: Grant execute permission for gradlew
        run: chmod +x apps/mobile/android/gradlew

      - name: Build Android APK (Debug / Direct Install)
        run: |
          cd apps/mobile/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and copy APK artifact
        run: |
          mkdir -p build-artifacts/android
          cp apps/mobile/android/app/build/outputs/apk/debug/*.apk build-artifacts/android/india-trikotaj-debug.apk
          ls -la build-artifacts/android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: india-trikotaj-android-apk
          path: build-artifacts/android/india-trikotaj-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS App (Simulator & Export)
    runs-on: macos-13
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.2.app || sudo xcode-select -switch /Applications/Xcode_15.0.1.app || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @india-trikotaj/shared
        run: pnpm --filter @india-trikotaj/shared build

      - name: Export Hermes production bundle
        run: pnpm --dir apps/mobile exec expo export -p ios --output-dir dist/ios

      - name: Expo Prebuild iOS
        run: pnpm --dir apps/mobile exec expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd apps/mobile/ios
          pod install --repo-update

      - name: Build iOS Application with Xcode
        run: |
          WORKSPACE=$(find apps/mobile/ios -name "*.xcworkspace" | head -n 1)
          echo "Using workspace: $WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag{gsub(/^[ \t]+/, ""); print; exit}')
          echo "Detected scheme: $SCHEME"
          
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath apps/mobile/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS .app into ZIP
        run: |
          mkdir -p build-artifacts/ios
          APP_DIR=$(find apps/mobile/ios/build/Build/Products/Release-iphonesimulator -name "*.app" | head -n 1)
          echo "Found compiled app at: $APP_DIR"
          cd $(dirname "$APP_DIR")
          zip -r "$GITHUB_WORKSPACE/build-artifacts/ios/IndiaTrikotaj-iOS-Simulator.app.zip" $(basename "$APP_DIR")
          ls -la "$GITHUB_WORKSPACE/build-artifacts/ios"

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: india-trikotaj-ios-app
          path: build-artifacts/ios/IndiaTrikotaj-iOS-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14
